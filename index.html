<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Samurai Bikes — Catálogo mayorista</title>

    <!-- Arranca la conexión (DNS + TLS) a Firebase en paralelo con la
         descarga del JS, en vez de esperar a que el código la pida —
         ahorra ida y vuelta en el primer pedido a Firestore/Auth/Storage. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="dns-prefetch" href="https://firebasestorage.googleapis.com" />
    <meta name="description" content="Catálogo mayorista de bicicletas y accesorios Samurai. Precios exclusivos para distribuidores, tiendas y talleres de todo el país." />

    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Samurai" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Samurai Bikes" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samurai Bikes — Catálogo mayorista" />
    <meta name="twitter:description" content="Catálogo mayorista de bicicletas y accesorios. Precios exclusivos para distribuidores." />
    <meta name="twitter:image" content="https://samurai.ar/img/samurai-negro-total.png" />
  </head>
